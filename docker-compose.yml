services:
  postgres:
    image: postgres:16
    container_name: broker_immo_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: broker_immo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d broker_immo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
